<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Aratoca en Hilos">
  <rect width="64" height="64" rx="14" fill="#F7F2E9"/>
  <!-- Penca de fique: leaves fanning out from a common base -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 52 C 18 44, 11 30, 13 14 C 25 20, 31 33, 32 52 Z" fill="#4C7A3D"/>
    <path d="M32 52 C 46 44, 53 30, 51 14 C 39 20, 33 33, 32 52 Z" fill="#8FA878"/>
    <path d="M32 52 C 28 38, 28 24, 32 8 C 36 24, 36 38, 32 52 Z" fill="#6B4226"/>
  </g>
  <!-- Hilo: the thread wrapping the base -->
  <path d="M18 50 C 26 45, 38 45, 46 50" stroke="#B85C38" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
